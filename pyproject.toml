[build-system]
requires = ["setuptools>=77,<78"]
build-backend = "setuptools.build_meta"

[project]
name = "corvore"
version = "0.0.0.dev0"
description = "Offline-first field appliance foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
corvorectl = "corvore.__main__:main"
corvored = "corvore.daemon:main"

[tool.setuptools.packages.find]
where = ["node"]
include = ["corvore*"]

[tool.setuptools.package-data]
corvore = [
    "migrations/core/*.sql",
    "migrations/observations/*.sql",
]
